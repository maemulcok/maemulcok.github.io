# ============================================================
#  Supabase 무료 프로젝트 '7일 미접속 자동 일시정지' 방지
# ------------------------------------------------------------
#  · 위치: 저장소 루트의 .github/workflows/supabase-keepalive.yml
#    (GitHub Pages 로 배포하는 폴더가 아니라, 저장소 최상단의 .github 아래에 둡니다)
#
#  · 준비: 저장소 > Settings > Secrets and variables > Actions > New repository secret
#       SUPABASE_URL        예) https://abcdefghijk.supabase.co
#       SUPABASE_ANON_KEY   Supabase > Project Settings > API > anon public 키
#
#  · 동작: 3~4일 간격(월·목 03:00 UTC = 한국 12:00)으로 실제 테이블에 가벼운 조회를
#          한 번 보내 '활동'으로 기록되게 합니다. 조회 결과는 아무것도 저장하지 않습니다.
#          (RLS 때문에 로그인 없는 이 요청은 빈 결과만 받습니다. 정상입니다.)
#
#  · 수동 실행: Actions 탭 > Supabase keep-alive > Run workflow
# ============================================================
name: Supabase keep-alive

on:
  schedule:
    # 월요일·목요일 03:00 UTC (한국 시간 12:00) → 간격이 3일 또는 4일
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 설정 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::저장소 Secrets 에 SUPABASE_URL / SUPABASE_ANON_KEY 를 먼저 등록해 주세요."
            exit 1
          fi
          echo "대상: ${SUPABASE_URL}"

      - name: 데이터베이스에 가벼운 조회 1회
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          URL="${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1"

          for i in 1 2 3; do
            CODE=$(curl -sS -m 30 -o /tmp/body.txt -w '%{http_code}' \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Accept: application/json" \
              "$URL" || echo "000")
            echo "시도 ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              head -c 300 /tmp/body.txt; echo
              echo "✅ Supabase 응답 확인 — 프로젝트가 깨어 있습니다."
              exit 0
            fi
            if [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
              echo "::error::키가 맞지 않습니다(HTTP ${CODE}). SUPABASE_ANON_KEY 를 다시 확인해 주세요."
              cat /tmp/body.txt || true
              exit 1
            fi
            sleep 20
          done

          echo "::error::Supabase 에 연결하지 못했습니다(마지막 HTTP ${CODE})."
          cat /tmp/body.txt || true
          exit 1
